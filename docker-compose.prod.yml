name: adpilot-production

services:
  mongodb:
    image: mongo:7.0
    container_name: adpilot-prod-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-adpilot}
    volumes:
      - mongodb_prod_data:/data/db
      - ./infrastructure/docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - adpilot-prod-net

  redis:
    image: redis:7.2-alpine
    container_name: adpilot-prod-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - adpilot-prod-net

  minio:
    image: minio/minio:latest
    container_name: adpilot-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - adpilot-prod-net

  agent:
    build:
      context: ./agent
      dockerfile: ../infrastructure/docker/agent.Dockerfile
      target: prod
    container_name: adpilot-prod-agent
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - adpilot-prod-net

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
      target: prod
    container_name: adpilot-prod-backend
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      AGENT_SERVICE_URL: http://agent:8000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:?Set META_TOKEN_ENCRYPTION_KEY}
      META_ALLOW_FIXTURE_SYNC: "false"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      agent:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - adpilot-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      target: prod
      args:
        VITE_BACKEND_URL: ""
    container_name: adpilot-prod-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - adpilot-prod-net

volumes:
  mongodb_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  adpilot-prod-net:
    driver: bridge
